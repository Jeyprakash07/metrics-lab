# prometheus.yml — read top to bottom, it is the lesson.
#
# Prometheus loop, forever:
#   1. SERVICE DISCOVERY produces a list of targets (with __meta_* labels).
#   2. RELABELING rewrites/filters that list (relabel_configs).
#   3. Every scrape_interval it sends HTTP GET <target>/metrics  (PULL).
#   4. It parses the text, attaches job + instance labels, appends samples to the TSDB.
#   5. It also writes a synthetic "up" series: 1 if the scrape worked, 0 if not.
#      That is a free health check that push systems don't give you.
#
# Retention is NOT configured here: it is set with command-line flags
# (see docker-compose.yml: --storage.tsdb.retention.time / .size).

global:
  scrape_interval: 15s      # how often to pull each target
  scrape_timeout: 10s       # must be <= scrape_interval
  evaluation_interval: 15s  # how often recording/alerting rules run
  external_labels:          # added when data LEAVES this Prometheus (remote_write, federation, alerts)
    cluster: lab-local      # in production: cluster, region, env. They tell Thanos/Mimir
    replica: prom-0         # where each series came from, and let it dedupe HA pairs.

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # ---------------------------------------------------------------------------
  # 1) static_configs: hard-coded targets. Fine for Prometheus scraping itself.
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # 2) docker_sd_configs: ask the Docker API which containers exist.
  #    Same idea as kubernetes_sd_configs in production (see README):
  #    the platform knows what is running, Prometheus asks it, and containers
  #    opt in with labels or annotations. Scale the service up or down and
  #    targets appear or vanish within refresh_interval. Nobody edits config.
  # ---------------------------------------------------------------------------
  - job_name: order-service
    scrape_interval: 10s
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:                         # server-side filter: only opted-in containers
          - name: label
            values: ["prometheus.scrape=true"]
    relabel_configs:
      # Docker label prometheus.port=8080  ->  scrape <container-ip>:8080
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      # Docker label prometheus.path=/metrics -> __metrics_path__ (defaults to /metrics)
      - source_labels: [__meta_docker_container_label_prometheus_path]
        regex: (.+)
        target_label: __metrics_path__
      # instance defaults to __address__ (an IP that changes on every restart).
      # Use the container name instead, which is stable and readable.
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: instance
      # Copy useful platform metadata onto every series from this target.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_env]
        target_label: env
      # Any label starting with __ is dropped after relabeling, so all the
      # __meta_* labels vanish and don't bloat storage.

  # ---------------------------------------------------------------------------
  # 3) dns_sd_configs: resolve a DNS name and scrape every IP it returns.
  #    In Kubernetes this matches a "headless Service". With Consul, the SRV records.
  # ---------------------------------------------------------------------------
  - job_name: grafana
    dns_sd_configs:
      - names: ["grafana"]
        type: A
        port: 3000
        refresh_interval: 30s

  # ---------------------------------------------------------------------------
  # 4) file_sd_configs: Prometheus watches JSON/YAML files for target lists.
  #    The generic escape hatch: any tool (Ansible, a cron script, a CMDB export)
  #    can write the file and Prometheus picks up changes with no reload.
  # ---------------------------------------------------------------------------
  - job_name: pushgateway
    honor_labels: true   # IMPORTANT for Pushgateway: keep the job/instance labels the
                         # batch job pushed, instead of overwriting them with
                         # job="pushgateway", instance="pushgateway:9091".
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 1m

  # ---------------------------------------------------------------------------
  # Production-only examples (commented, they need a real cluster):
  #
  # - job_name: kubernetes-pods
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: "true"
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
  #       regex: (.+);(.+)
  #       replacement: $2:$1
  #       target_label: __address__
  #     - source_labels: [__meta_kubernetes_namespace]
  #       target_label: namespace
  #     - source_labels: [__meta_kubernetes_pod_name]
  #       target_label: pod
  #
  #   With the Prometheus Operator you write a ServiceMonitor/PodMonitor CRD
  #   instead, and the operator generates exactly this kind of block for you.
  # ---------------------------------------------------------------------------

# Long-term storage. Local TSDB keeps ~15-30 days. For months or years, stream
# every sample to a horizontally scalable backend (Mimir, Thanos Receive, Cortex,
# VictoriaMetrics, or Grafana Cloud):
#
# remote_write:
#   - url: http://mimir:9009/api/v1/push
#     queue_config: { max_samples_per_send: 5000 }
#     write_relabel_configs:            # ship less: drop noisy series before they leave
#       - source_labels: [__name__]
#         regex: go_gc_.*
#         action: drop
